<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Loop &amp; Lift Admin</title>
<style>
@font-face { font-family: 'Fredoka'; font-weight: 700; font-display: swap; src: url(../assets/fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 600; font-display: swap; src: url(../assets/fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
:root {
  --ink: #2a0948; --text: #2b2336; --muted: #6f6680; --line: #e7e1ef; --bg: #f6f3fa; --card: #ffffff;
  --pink: #ff4fa0; --violet: #7b3cf0;
  --pending: #b26a00; --pending-bg: #fff3dc; --approved: #137a3f; --approved-bg: #ddf6e7;
  --invited: #2557c7; --invited-bg: #e0eaff; --rejected: #9a2340; --rejected-bg: #fde3ea;
  --grey: #5d566b; --grey-bg: #ece8f1;
  --f-title: 'Fredoka', system-ui, sans-serif; --f-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--f-body); }
h1, h2, h3, .brand, .num { font-family: var(--f-title); }
button { font: 600 14px var(--f-body); cursor: pointer; }
input, select, textarea { font: 14px var(--f-body); color: var(--text); }
a { color: var(--violet); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--bg); padding: 1px 5px; border-radius: 6px; }

/* ---------- top bar: brand + account on the first row, the tabs on their own (scrollable) row ---------- */
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 24px 0; background: var(--ink); color: #fff; }
.brand { font-size: 22px; font-weight: 700; }
.brand b { color: #ffcf3a; }
.brand span { color: var(--pink); }
.top nav { order: 3; flex-basis: 100%; display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.top nav::-webkit-scrollbar { display: none; }
.top nav a { flex: none; color: #fff; text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 999px; opacity: .75; white-space: nowrap; }
.top nav a[aria-current] { background: rgba(255, 255, 255, .14); opacity: 1; }
.top nav .cnt { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 12px; text-align: center; }
.top .me { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .9; }
.top .me button { background: rgba(255, 255, 255, .14); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; }

main { max-width: 1240px; margin: 0 auto; padding: 24px; }

/* ---------- login ---------- */
.login { max-width: 420px; margin: 12vh auto; background: var(--card); border-radius: 22px; padding: 30px; box-shadow: 0 10px 40px rgba(42, 9, 72, .12); }
.login h1 { margin: 0 0 4px; font-size: 28px; color: var(--ink); }
.login p { color: var(--muted); margin: 0 0 18px; }
.login input { width: 100%; font: 16px var(--f-body); padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; }
.login input:focus { outline: none; border-color: var(--violet); }
.login button { margin-top: 12px; width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--violet); color: #fff; font-size: 16px; }
.login .msg { margin-top: 12px; font-weight: 600; }
.login .linkish { background: none; color: var(--violet); width: auto; padding: 6px 0; margin-top: 8px; font-size: 14px; text-align: left; }

/* ---------- view header ---------- */
.vh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 16px; }
.vh h2 { margin: 0; font-size: 26px; color: var(--ink); }
.vh .sub { color: var(--muted); font-size: 14px; }
.vh .tool:first-of-type { margin-left: auto; }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; margin-bottom: 12px; }
.back svg { width: 16px; height: 16px; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--card); border-radius: 16px; padding: 14px 16px; border: 1px solid var(--line); color: inherit; text-decoration: none; display: block; }
a.stat:hover { border-color: var(--violet); }
.stat .num { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.stat .num.long { font-size: 24px; line-height: 1.25; }
.stat .lbl { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat.hot .num { color: var(--pink); }
.stat.bad .num { color: var(--rejected); }

/* ---------- toolbar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.bar input[type=search] { flex: 1 1 240px; font: 15px var(--f-body); padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.bar select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .c { opacity: .65; margin-left: 4px; }
.tool { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 12px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.tool svg { width: 15px; height: 15px; flex: none; }
.tool.sm { padding: 6px 10px; border-radius: 10px; font-size: 13px; }
.tool.ok { background: var(--approved); color: #fff; border-color: var(--approved); }
.tool.pri { background: var(--violet); color: #fff; border-color: var(--violet); }
.tool.no { color: var(--rejected); }
.tool:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- cards (applications, players, feedback) ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, #ffd6ea, #e5d6ff); display: grid; place-items: center; font: 700 24px var(--f-title); color: var(--ink); cursor: zoom-in; }
.avatar.sm { width: 48px; height: 48px; font-size: 20px; cursor: default; }
.who { min-width: 0; flex: 1; }
.who h3 { margin: 0; font-size: 19px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who h3 a { color: inherit; text-decoration: none; }
.who h3 a:hover { text-decoration: underline; }
.who .sub, .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.badge { margin-left: auto; align-self: flex-start; flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: capitalize; white-space: nowrap; }
.badge.inl { margin-left: 0; align-self: center; }
.badge.pending { color: var(--pending); background: var(--pending-bg); }
.badge.approved { color: var(--approved); background: var(--approved-bg); }
.badge.invited { color: var(--invited); background: var(--invited-bg); }
.badge.rejected, .badge.blocked { color: var(--rejected); background: var(--rejected-bg); }
.badge.plan { color: var(--violet); background: #efe7ff; text-transform: none; }
.badge.fs-new { color: #b0005c; background: #ffe1ef; }
.badge.fs-seen, .badge.fs-wontfix { color: var(--grey); background: var(--grey-bg); }
.badge.fs-planned { color: var(--invited); background: var(--invited-bg); }
.badge.fs-fixed { color: var(--approved); background: var(--approved-bg); }
.kind { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
.kind.k-bug { color: var(--rejected); background: var(--rejected-bg); }
.kind.k-idea { color: var(--invited); background: var(--invited-bg); }
.kind.k-love { color: #b0005c; background: #ffe1ef; }
.kind.k-other { color: var(--grey); background: var(--grey-bg); }
.online { display: inline-flex; align-items: center; gap: 5px; color: var(--approved); font-weight: 700; }
.online::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #1fbf63; box-shadow: 0 0 0 3px #d4f5e1; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.facts select { padding: 2px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); max-width: 100%; }
.note { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.mine { width: 100%; font: 14px var(--f-body); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; min-height: 38px; background: #fffdf6; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.acts button, .acts a.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 11px; color: var(--text); text-decoration: none; font: 600 14px var(--f-body); }
.acts .ok { background: var(--approved); color: #fff; border-color: var(--approved); }
.acts .no { color: var(--rejected); }
.acts .mail { background: var(--invited); color: #fff; border-color: var(--invited); }
.acts .del { margin-left: auto; color: var(--muted); border-color: transparent; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; background: var(--card); border-radius: 18px; border: 1px dashed var(--line); }
.empty h2 { color: var(--ink); margin: 0 0 6px; }
.empty.sm { padding: 22px 14px; font-size: 14px; }

/* ---------- panels (overview, player detail, settings) ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; margin-bottom: 14px; }
.panel > h3 { margin: 0 0 10px; font-size: 18px; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel > h3 .sub { font: 13px var(--f-body); }
.panel > h3 .tool { margin-left: auto; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cols > div { min-width: 0; }
.row2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.row2 label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; }
.row2 select, .row2 input, .field input, .field select, .field textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.row2 input { width: 110px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span { font-weight: 600; font-size: 14px; }
.field small { color: var(--muted); font-size: 12.5px; }
.field textarea { width: 100%; min-height: 64px; resize: vertical; }
.pw { margin-top: 10px; background: #fffbe8; border: 1px solid #f3e2a4; border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; }
.pw code { font-size: 17px; background: #fff; padding: 4px 10px; letter-spacing: .5px; user-select: all; }

/* switch */
.switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: #d6cfe0; border-radius: 999px; transition: background .15s; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.switch input:checked + span { background: var(--approved); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--violet); outline-offset: 2px; }
.swrow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 600; }

/* feature chips */
.ce { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 4px; font: 12.5px ui-monospace, Consolas, monospace; background: #efe7ff; color: var(--ink); border-radius: 999px; padding: 3px 4px 3px 10px; }
.fchip.neg { background: var(--rejected-bg); color: var(--rejected); }
.fchip button { border: 0; background: rgba(0, 0, 0, .08); color: inherit; width: 20px; height: 20px; border-radius: 50%; padding: 0; line-height: 20px; font-size: 13px; }
.ce input, .tbl .ce input[data-cein] { width: 150px; min-width: 0; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; font: 12.5px ui-monospace, Consolas, monospace; }

/* tables */
.tw { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th.n { text-align: right; }
.tbl input:not([type=checkbox]), .tbl select, .tbl textarea { width: 100%; min-width: 90px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.tbl textarea { min-height: 34px; resize: vertical; min-width: 200px; }
.nowrap { white-space: nowrap; }
.expired { color: var(--rejected); font-weight: 600; }

/* charts */
.chart { position: relative; height: 190px; }
.chart svg { display: block; overflow: visible; }
.chart .bar { fill: var(--violet); }
.chart .bar.on { fill: var(--ink); }
.chart .grid line { stroke: var(--line); }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.chart .none { fill: var(--muted); font-size: 13px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .trk { height: 12px; }
.hbar .fill { height: 12px; min-width: 3px; background: var(--violet); border-radius: 0 4px 4px 0; }
.hbar .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* activity timeline */
.tl h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tl h4:first-child { margin-top: 0; }
.tl ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tl li { display: grid; grid-template-columns: 52px 10px 1fr; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 8px; font-size: 14px; min-width: 0; }
.tl li > div { min-width: 0; overflow-wrap: anywhere; }
.tl time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tl .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c1d6; align-self: center; }
.tl .k-build .dot { background: var(--approved); }
.tl .k-remove .dot { background: #e08a00; }
.tl .k-design .dot { background: var(--violet); }
.tl .k-fb .dot { background: var(--pink); }
.tl .k-error { background: var(--rejected-bg); }
.tl .k-error .dot { background: var(--rejected); }
.tl .who { font-weight: 700; color: var(--ink); text-decoration: none; }
.tl details summary { cursor: pointer; }
.pre { margin: 6px 0 0; padding: 10px; background: #1f1630; color: #efe9f7; border-radius: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }

/* parks */
.parks { display: grid; gap: 14px; }
.park { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.pthumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; background: linear-gradient(135deg, #ffd6ea, #e5d6ff); display: grid; place-items: center; color: var(--muted); font-size: 13px; cursor: zoom-in; }
.park h4 { margin: 0; font: 700 18px var(--f-title); color: var(--ink); overflow-wrap: anywhere; }
.pstats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pstats span { background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.pstats b { color: var(--ink); }
.shots { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
.shots figure { margin: 0; flex: none; width: 128px; }
.shots img { width: 128px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; cursor: zoom-in; display: block; }
.shots figcaption { font-size: 11.5px; color: var(--muted); }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.mini { text-decoration: none; color: inherit; }
.mini img, .mini .ph { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 10px; background: linear-gradient(135deg, #ffd6ea, #e5d6ff); display: block; }
.mini b { display: block; font-size: 14px; color: var(--ink); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini span { font-size: 12.5px; color: var(--muted); }

/* feedback */
.fbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.fb .shot { width: 100%; max-height: 260px; object-fit: contain; background: #120a1f; border-radius: 12px; cursor: zoom-in; }
.fb .reply { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.fb .reply textarea { width: 100%; min-height: 60px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.fb .reply .sent .note { background: #efe7ff; }
.fb .reply button { justify-self: start; }

.zoom { position: fixed; inset: 0; background: rgba(20, 10, 40, .8); display: grid; place-items: center; z-index: 20; cursor: zoom-out; }
.zoom img { max-width: 92vw; max-height: 90vh; border-radius: 16px; }
.ask-bg { position: fixed; inset: 0; z-index: 60; background: rgba(23, 8, 42, .55); display: grid; place-items: center; padding: 16px; }
.ask { background: #fff; color: var(--ink); width: min(460px, 100%); border-radius: 16px; padding: 18px 20px; box-shadow: 0 0 0 3px var(--ink), 0 14px 40px rgba(0, 0, 0, .35); display: grid; gap: 12px; }
.ask p { margin: 0; white-space: pre-wrap; font-weight: 600; line-height: 1.45; }
.ask textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid #d9ccef; resize: vertical; }
.ask-row { display: flex; justify-content: flex-end; gap: 8px; }
.ask-row button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--ink); cursor: pointer; background: #fff; }
.ask-row .ask-ok { background: var(--ink); color: #fff; }
.toast { position: fixed; bottom: 20px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: 92vw; }

@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  main { padding: 14px; } .top { padding: 10px 14px 0; } .top .me span { display: none; }
  .grid, .fbgrid { grid-template-columns: 1fr; }
  .park { grid-template-columns: 1fr; }
  .vh h2 { font-size: 22px; }
  .stat .num { font-size: 24px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Loop</b> <span>&amp;</span> <b>Lift</b> admin</div>
  <nav aria-label="Sections" id="tabs" class="hidden">
    <a href="#overview" data-v="overview">Overview</a>
    <a href="#players" data-v="players">Players<span class="cnt hidden" id="cntPending"></span></a>
    <a href="#feedback" data-v="feedback">Feedback<span class="cnt hidden" id="cntFeedback"></span></a>
    <a href="#builds" data-v="builds">Builds</a>
    <a href="#settings" data-v="settings">Game settings</a>
    <a href="#plans" data-v="plans">Plans &amp; features</a>
    <a href="#invites" data-v="invites">Invites</a>
    <a href="#applications" data-v="applications">Applications</a>
  </nav>
  <div class="me hidden" id="me"><span id="meMail"></span><button id="pw" type="button">My password</button><button id="out" type="button">Sign out</button></div>
</header>

<main>
  <!-- sign in: email + password, or a one-time link to the owner's email (no public sign-ups) -->
  <section class="login hidden" id="login">
    <h1>Admin sign in</h1>
    <p>Only the Loop &amp; Lift team can sign in here.</p>
    <form id="loginForm">
      <input type="email" id="loginEmail" required placeholder="you@mail.com" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
      <button type="submit">Sign in</button>
    </form>
    <button type="button" class="linkish" id="byLink">No password yet / forgot it? Email me a sign-in link</button>
    <div class="msg" id="loginMsg"></div>
  </section>

/** 30-day play-time bars (one series: no legend, the panel title names it), hover for the day's numbers. */
function chart(box, rows, days, withPlayers) {
  const by = new Map((rows || []).map(r => [String(r.day).slice(0, 10), r])), now = new Date(), list = [];
  // the server groups by its own (UTC) day

    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - i)), r = by.get(d.toISOString().slice(0, 10));

    const W = Math.max(260, box.clientWidth), H = 190, L = 46, R = 6, T = 12, B = 24;
    if (W === lastW) return;

    const max = Math.max(0, ...list.map(x => x.s)), hours = max >= 7200, u = hours ? 3600 : 60;
    const v = Math.max(max / u, hours ? 2 : 4), raw = v / 4, p = 10 ** Math.floor(Math.log10(raw));
    const step = Math.max(1, [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw)), top = step * Math.ceil(v / step);
    const ph = H - T - B, cw = (W - L - R) / days, bw = Math.max(2, Math.min(26, cw - 2)), y = val => H - B - val / top * ph;
    let g = '';
    for (let t = 0; t <= top + 1e-9; t += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${num(t, 1)} ${hours ? 'h' : 'min'}</text>`;
    let bars = '', xl = '';
    list.forEach((x, i) => {
      if (x.s) {
        const h = Math.max(2, x.s / u / top * ph), bx = L + i * cw + (cw - bw) / 2, by = H - B - h, r = Math.min(4, bw / 2, h);
        bars += `<path class="bar" data-i="${i}" d="M${bx},${by + h}V${by + r}Q${bx},${by} ${bx + r},${by}H${bx + bw - r}Q${bx + bw},${by} ${bx + bw},${by + r}V${by + h}Z"/>`;
      }
      if ((days - 1 - i) % 7 === 0) {
        const last = i === days - 1;
        xl += `<text x="${last ? W - R : L + i * cw + cw / 2}" y="${H - 6}" text-anchor="${last ? 'end' : 'middle'}">${x.d.toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: 'UTC' })}</text>`;
      }

      ${max ? '' : `<text class="none" x="${(L + W) / 2}" y="${H / 2}" text-anchor="middle">No play time in these ${days} days</text>`}
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${ph}" fill="transparent"/></svg><div class="tip hidden"></div>`;
    const svg = box.querySelector('svg'), tip = box.querySelector('.tip');
    const hover = e => {
      const rc = svg.getBoundingClientRect(), i = Math.floor((e.clientX - rc.left - L) / cw);
      if (i < 0 || i >= days) return leave();
      const x = list[i];
      box.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on'));
      box.querySelector(`.bar[data-i="${i}"]`)?.classList.add('on');
      tip.innerHTML = `<b>${x.d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' })}</b><br>${dur(x.s)} played<br>${x.n} session${x.n === 1 ? '' : 's'}${withPlayers ? ` · ${x.p} player${x.p === 1 ? '' : 's'}` : ''}`;
      const cx = Math.min(Math.max(L + i * cw + cw / 2, 80), W - 80);
      tip.style.left = cx + 'px'; tip.style.top = Math.max(y(x.s / u) - 8, 40) + 'px';
      tip.classList.remove('hidden');
    };
    const leave = () => { tip.classList.add('hidden'); box.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on')); };
    svg.addEventListener('pointermove', hover); svg.addEventListener('pointerdown', hover); svg.addEventListener('pointerleave', leave);
  };
  box._ro?.disconnect();
  box._ro = new ResizeObserver(draw);
  box._ro.observe(box);

}

    case 'ride.built': return `Built ${d.kind === 'coaster' ? 'a coaster' : d.kind === 'cable' ? 'a cable car' : 'a ride'}${quoted(d.name)}` + m([t(pretty(d.type)), d.design && 'design ' + t(d.design)].filter(Boolean).join(' · '));
    case 'ride.removed': return 'Removed a ride' + m(t(pretty(d.type)));
    case 'coaster.designed': return `Designed a coaster` + m([t(pretty(d.type)), d.pieces != null && `${num(d.pieces)} pieces`, d.length != null && `${num(d.length)} m long`,
      d.height != null && `${num(d.height)} m high`, d.inversions != null && `${num(d.inversions)} inversions`,
      d.excitement != null && `excitement ${num(d.excitement, 2)}`, d.intensity != null && `intensity ${num(d.intensity, 2)}`].filter(Boolean).join(' · '));
    case 'shop.built': return 'Built a shop' + m(t(pretty(d.type)));
    case 'designer.open': return 'Opened the coaster designer' + m(t(pretty(d.type)));
    case 'photo.mode': return 'Used photo mode';
    case 'feedback.sent': return 'Sent feedback';
    case 'error': return `<details><summary>${name}Error: ${t(d.msg || 'unknown')}</summary>${d.src ? `<div class="muted">${t(d.src)}</div>` : ''}${d.stack ? `<pre class="pre">${t(d.stack)}</pre>` : ''}</details>`;
    default: return `<code>${t(e.kind)}</code>` + (e.data != null ? m(t(JSON.stringify(e.data).slice(0, 300))) : '');
  }
}
/** Events grouped by local day; `who` adds the player's name (the overview's activity feed). */
function timeline(evs, who) {
  if (!evs.length) return '<div class="empty sm">Nothing yet. When the game sends events, they show up here.</div>';
  let out = '', cur = '';
  for (const e of evs) {
    const d = new Date(e.at).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    if (d !== cur) { out += (cur ? '</ul>' : '') + `<h4>${esc(d)}</h4><ul>`; cur = d; }
    const name = who ? `<a class="who" href="#player/${esc(e.player)}">${esc(e.players?.username || '?')}</a> ` : '';
    out += `<li class="k-${EV_GROUP[e.kind] || 'other'}"><time>${clock(e.at)}</time><span class="dot"></span><div>${e.kind === 'error' ? evText(e, name) : name + evText(e)}</div></li>`;
  }
  return `<div class="tl">${out}</ul></div>`;
}

/** Saves a change to a player and redraws whatever shows them. */
async function updatePlayer(id, patch, msg = 'Saved') {
  const { data, error } = await sb.from('players').update(patch).eq('id', id).select('*');
  if (error || !data?.length) { toast('Not saved: ' + (error?.message || 'no access')); return null; }
  const row = data[0], i = players.findIndex(x => x.id === id);
  if (i >= 0) players[i] = { ...players[i], ...row };
  if (cur?.p.id === id) Object.assign(cur.p, row);
  toast(msg);
  refreshCounts();
  if (!$('v-players').classList.contains('hidden')) renderPlayers();
  if (!$('v-player').classList.contains('hidden') && cur?.p.id === id) { renderHead(); renderAccess(); }
  return row;
}
const findPlayer = id => players.find(x => x.id === id) || (cur?.p.id === id ? cur.p : null);
async function playerAct(id, act) {
  const p = findPlayer(id);
  if (!p) return;
  if (act === 'approve') return updatePlayer(id, { status: 'approved' }, `${p.username} approved`);
  if (act === 'block') {
    const r = await ask(`Block ${p.username}? They can't play until you unblock them (their game stops at the next check).\n\nReason (the player sees it):`, p.block_reason || '');
    if (r === null) return;
    return updatePlayer(id, { status: 'blocked', block_reason: r.trim().slice(0, 500) || null }, `${p.username} blocked`);
  }
  if (act === 'unblock') {
    if (!await sure(`Unblock ${p.username}? They can play again.`)) return;
    return updatePlayer(id, { status: 'approved', block_reason: null }, `${p.username} unblocked`);
  }
}
async function setPlan(id, plan, sel) {
  const p = findPlayer(id);
  if (plan === 'admin' && !await sure(`Give ${p.username} the Owner plan? Everything opens, no watermark, the game never closes for them.`)) { sel.value = p.plan; return; }
  if (!await updatePlayer(id, { plan }, `${p.username}: ${planName(plan)}`)) sel.value = p.plan;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pact]');
  if (b) playerAct(b.closest('[data-pid]').dataset.pid, b.dataset.pact);
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-plan]')) setPlan(e.target.closest('[data-pid]').dataset.pid, e.target.value, e.target);
});

// random, readable (no 0/O, 1/l/I), from the browser's crypto
function newPassword(n = 12) {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', out = [];
  while (out.length < n) for (const b of crypto.getRandomValues(new Uint8Array(32))) if (b < 224 && out.length < n) out.push(abc[b % 56]);
  return out.join('');
}

  if (!open && config.open && !await sure('Close the game for everyone except you?')) return;
  const patch = { open, maintenance: $('cfgMaint').value.trim() || null, message: $('cfgMsg').value.trim() || null, min_version: min || null, offline_hours: off, updated_at: new Date().toISOString() };
  const { data, error } = await sb.from('game_config').update(patch).eq('id', 1).select('*');
  if (error || !data?.length) return toast('Not saved: ' + (error?.message || 'no access'));
  config = data[0]; toast('Settings saved');
  loadSettings();
}

// =====================================================================================================
// Plans & features
// =====================================================================================================
/** Chips for feature patterns + an input with the catalogue as suggestions. id = 'grant:<player>' or 'plan:<id>'. */
function chipEdit(id, vals, ph) {
  return `<div class="ce" data-ce="${esc(id)}">${vals.map(v => `<span class="fchip${v.startsWith('!') ? ' neg' : ''}" data-v="${esc(v)}">${esc(v)}<button type="button" data-cerm aria-label="Remove ${esc(v)}">&times;</button></span>`).join('')}
    <input list="featList" data-cein placeholder="${esc(ph)}" maxlength="61" aria-label="Add a feature pattern"><button type="button" class="tool sm" data-ceadd>Add</button></div>`;
}
const PATTERN = /^!?[a-z0-9_.*-]{1,60}$/;
async function chipSave(ce, list) {
  const [kind, id] = ce.dataset.ce.split(/:(.*)/s);
  if (kind === 'grant') {
    const p = findPlayer(id);
    return updatePlayer(id, { grant_features: list }, `${p?.username || 'Player'}: features saved`);
  }
  if (kind === 'plan') {
    const { error } = await sb.from('plans').update({ features: list }).eq('id', id);
    if (error) return toast('Not saved: ' + error.message);
    plans.find(p => p.id === id).features = list;
    toast(`${planName(id)}: features saved`);
    renderPlans();
  }
}
function chipAdd(ce) {
  const inp = ce.querySelector('[data-cein]'), v = inp.value.trim().toLowerCase();
  if (!v) return;
  if (!PATTERN.test(v)) return toast('A pattern looks like coaster.giga, coaster.* or !designer.ai');
  const list = [...ce.querySelectorAll('.fchip')].map(c => c.dataset.v);
  if (list.includes(v)) return toast('Already there');
  chipSave(ce, [...list, v]);
}
document.addEventListener('click', e => {
  const rm = e.target.closest('[data-cerm]');
  if (rm) { const ce = rm.closest('[data-ce]'), v = rm.parentElement.dataset.v; chipSave(ce, [...ce.querySelectorAll('.fchip')].map(c => c.dataset.v).filter(x => x !== v)); }
  const add = e.target.closest('[data-ceadd]');
  if (add) chipAdd(add.closest('[data-ce]'));
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-cein]')) { e.preventDefault(); chipAdd(e.target.closest('[data-ce]')); } });

let planUse = new Map();
async function loadPlans() {
  const el = $('v-plans');
  if (!el.dataset.ok) el.innerHTML = loading();
  const [, pl] = await Promise.all([loadCatalog(), q(sb.from('players').select('plan'))]);
  planUse = new Map();
  for (const x of pl) planUse.set(x.plan, (planUse.get(x.plan) || 0) + 1);
  el.dataset.ok = 1;
  renderPlans();
}
function renderPlans() {
  $('v-plans').innerHTML = `
    <div class="vh"><h2>Plans &amp; features</h2><span class="sub">What each plan unlocks. Players get the change at their next sign-in.</span><button class="tool" data-reload type="button">${ICON.refresh}Refresh</button></div>
    <div class="panel"><h3>Plans</h3>
      <p class="sub" style="margin:0 0 10px">Patterns: <code>*</code> everything, <code>coaster.*</code> a group, <code>ride.megawheel</code> one thing, <code>!designer.ai</code> takes it away again.</p>
      <div class="tw"><table class="tbl">
        <tr><th>Plan</th><th>Name</th><th>Unlocks</th><th>Watermark</th><th class="n">Order</th><th class="n">Players</th><th></th></tr>
        ${plans.map(p => `<tr data-plid="${esc(p.id)}">
          <td><code>${esc(p.id)}</code></td>
          <td><input data-plf="name" value="${esc(p.name)}" maxlength="40"></td>
          <td style="min-width:260px">${chipEdit('plan:' + p.id, p.features || [], 'add a pattern')}</td>
          <td><label class="switch" title="Tester watermark"><input type="checkbox" data-plf="watermark"${p.watermark ? ' checked' : ''} aria-label="Watermark"><span></span></label></td>
          <td class="n"><input data-plf="sort" type="number" value="${esc(p.sort)}" style="width:70px;min-width:0"></td>
          <td class="n">${num(planUse.get(p.id) || 0)}</td>
          <td>${p.id === 'admin' || planUse.get(p.id) ? '' : `<button class="tool sm no" type="button" data-pldel>Delete</button>`}</td>
        </tr>`).join('')}
      </table></div>
      <form class="row2" id="plAdd" style="margin-top:12px">
        <input id="plNewId" placeholder="id, e.g. pro_plus" maxlength="20" style="width:150px" required>
        <input id="plNewName" placeholder="Name, e.g. Pro Plus" maxlength="40" style="width:180px" required>
        <label>Copy from <select id="plNewFrom"><option value="">nothing</option>${plans.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>
        <button class="tool pri sm" type="submit">Add plan</button>
      </form>
    </div>
    <div class="panel"><h3>Feature catalogue <span class="sub">the things the game knows how to lock (${features.length})</span></h3>
      ${features.length ? `<div class="tw"><table class="tbl">
        <tr><th>Key</th><th>Name</th><th>Group</th><th class="n">Order</th><th></th></tr>
        ${features.map(f => `<tr data-fkey="${esc(f.key)}">
          <td><code>${esc(f.key)}</code></td>
          <td><input data-ff="name" value="${esc(f.name)}" maxlength="80"></td>
          <td><input data-ff="grp" value="${esc(f.grp)}" maxlength="40"></td>
          <td class="n"><input data-ff="sort" type="number" value="${esc(f.sort)}" style="width:70px;min-width:0"></td>
          <td><button class="tool sm no" type="button" data-fdel>Delete</button></td>
        </tr>`).join('')}
      </table></div>` : '<div class="empty sm">No features listed yet.</div>'}
      <form class="row2" id="fAdd" style="margin-top:12px">
        <input id="fNewKey" placeholder="key, e.g. coaster.giga" maxlength="60" style="width:180px" required>
        <input id="fNewName" placeholder="Name, e.g. Giga Coaster" maxlength="80" style="width:180px" required>
        <input id="fNewGrp" placeholder="Group, e.g. Coasters" maxlength="40" style="width:150px">
        <button class="tool pri sm" type="submit">Add feature</button>
      </form>
    </div>`;
}
$('v-plans').addEventListener('change', async e => {
  const t = e.target, pr = t.closest('[data-plid]'), fr = t.closest('[data-fkey]');
  if (pr && t.dataset.plf) {
    const id = pr.dataset.plid, f = t.dataset.plf, v = f === 'watermark' ? t.checked : f === 'sort' ? Math.round(+t.value || 0) : t.value.trim();
    if (f === 'name' && !v) return toast('A plan needs a name');
    const { error } = await sb.from('plans').update({ [f]: v }).eq('id', id);
    if (error) return toast('Not saved: ' + error.message);
    plans.find(p => p.id === id)[f] = v; toast('Plan saved');
  }
  if (fr && t.dataset.ff) {
    const key = fr.dataset.fkey, f = t.dataset.ff, v = f === 'sort' ? Math.round(+t.value || 0) : t.value.trim() || (f === 'grp' ? 'Other' : '');
    if (f === 'name' && !v) return toast('A feature needs a name');
    const { error } = await sb.from('features').update({ [f]: v }).eq('key', key);
    if (error) return toast('Not saved: ' + error.message);
    features.find(x => x.key === key)[f] = v; toast('Feature saved');
  }
});
$('v-plans').addEventListener('click', async e => {
  const pd = e.target.closest('[data-pldel]');
  if (pd) {
    const id = pd.closest('[data-plid]').dataset.plid;
    if (!await sure(`Delete the plan "${planName(id)}"?`)) return;
    const { error } = await sb.from('plans').delete().eq('id', id);
    if (error) return toast('Not deleted: ' + error.message);
    toast('Plan deleted'); loadPlans();
  }
  const fd = e.target.closest('[data-fdel]');
  if (fd) {
    const key = fd.closest('[data-fkey]').dataset.fkey;
    if (!await sure(`Delete "${key}" from the catalogue? Plans that name it keep the pattern.`)) return;
    const { error } = await sb.from('features').delete().eq('key', key);
    if (error) return toast('Not deleted: ' + error.message);
    toast('Feature deleted'); loadPlans();
  }
});
$('v-plans').addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'plAdd') {
    const id = $('plNewId').value.trim().toLowerCase(), name = $('plNewName').value.trim(), from = plans.find(p => p.id === $('plNewFrom').value);
    if (!/^[a-z0-9_-]{2,20}$/.test(id)) return toast('Plan id: 2-20 of a-z, 0-9, _ and -');
    const { error } = await sb.from('plans').insert({ id, name, features: from?.features || [], watermark: from ? from.watermark : true, sort: Math.max(0, ...plans.map(p => p.sort)) + 1 });
    if (error) return toast('Not added: ' + error.message);
    toast(`Plan ${name} added`); loadPlans();
  }
  if (e.target.id === 'fAdd') {
    const key = $('fNewKey').value.trim().toLowerCase(), name = $('fNewName').value.trim(), grp = $('fNewGrp').value.trim() || 'Other';
    if (!/^[a-z0-9_.*-]{2,60}$/.test(key)) return toast('Key: 2-60 of a-z, 0-9 and _ . * -');
    const { error } = await sb.from('features').insert({ key, name, grp, sort: features.filter(f => f.grp === grp).length });
    if (error) return toast('Not added: ' + error.message);
    toast(`${key} added`); loadPlans();
  }
});

// =====================================================================================================
// Invites
// =====================================================================================================
const inviteCode = () => 'LOOPA-' + [...crypto.getRandomValues(new Uint8Array(4))].map(b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');
let invites = [];
async function loadInvites() {
  const el = $('v-invites');
  if (!el.dataset.ok) el.innerHTML = loading();
  invites = await q(sb.from('invites').select('*').order('created_at', { ascending: false }));
  el.dataset.ok = 1;
  const exp = i => i.expires_at && new Date(i.expires_at) < Date.now();
  el.innerHTML = `
    <div class="vh"><h2>Invites</h2><span class="sub">A code typed at sign-up approves the player at once</span><button class="tool" data-reload type="button">${ICON.refresh}Refresh</button></div>
    <form class="panel" id="invForm">
      <h3>New invite code</h3>
      <div class="row2">
        <label>Code <input id="invCode" value="${inviteCode()}" maxlength="24" style="width:160px;text-transform:uppercase" required></label>
        <button class="tool sm" type="button" id="invNew">New code</button>
        <label>Plan <select id="invPlan">${planOptions('tester')}</select></label>
        <label>Uses <input id="invUses" type="number" min="1" max="10000" value="1" style="width:80px"></label>
        <label>Expires <input id="invExp" type="datetime-local" style="width:auto"></label>
      </div>
      <div class="row2" style="margin-top:10px">
        <input id="invNote" placeholder="Note, e.g. for the Instagram giveaway" maxlength="200" style="flex:1;width:auto;min-width:200px">
        <button class="tool pri" type="submit">Create invite</button>
      </div>
    </form>
    <div class="panel"><h3>Codes <span class="sub">${invites.length}</span></h3>${invites.length ? `<div class="tw"><table class="tbl">
      <tr><th>Code</th><th>Plan</th><th class="n">Used</th><th class="n">Left</th><th>Expires</th><th>Note</th><th>Made</th><th></th></tr>
      ${invites.map(i => `<tr data-code="${esc(i.code)}">
        <td class="nowrap"><code>${esc(i.code)}</code> <button class="tool sm" type="button" data-invcopy title="Copy">${ICON.copy}</button></td>
        <td>${esc(planName(i.plan))}</td><td class="n">${num(i.used)}</td><td class="n">${num(i.uses_left)}</td>
        <td class="nowrap${exp(i) ? ' expired' : ''}">${i.expires_at ? esc(when(i.expires_at)) + (exp(i) ? ' (expired)' : '') : 'never'}</td>
        <td>${esc(i.note || '')}</td><td class="nowrap">${esc(day(i.created_at))}</td>
        <td><button class="tool sm no" type="button" data-invdel>Delete</button></td>
      </tr>`).join('')}</table></div>` : '<div class="empty sm">No invite codes yet.</div>'}</div>`;
  $('invNew').onclick = () => { $('invCode').value = inviteCode(); };
  $('invForm').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('invCode').value.trim().toUpperCase(), uses = Math.round(+$('invUses').value), x = $('invExp').value;
    if (!/^[A-Z0-9-]{4,24}$/.test(code)) return toast('Code: 4-24 of A-Z, 0-9 and -');
    if (!(uses >= 1)) return toast('Uses: at least 1');
    const row = { code, plan: $('invPlan').value, uses_left: uses, note: $('invNote').value.trim() || null, expires_at: x ? new Date(x).toISOString() : null };
    const { error } = await sb.from('invites').insert(row);
    if (error) return toast(/duplicate/i.test(error.message) ? 'That code already exists' : 'Not created: ' + error.message);
    await navigator.clipboard?.writeText(code).catch(() => {});
    toast(`${code} created and copied`); loadInvites();
  });
}
$('v-invites').addEventListener('click', async e => {
  const c = e.target.closest('[data-invcopy]');
  if (c) { const code = c.closest('[data-code]').dataset.code; await navigator.clipboard?.writeText(code).catch(() => {}); return toast(code + ' copied'); }
  const d = e.target.closest('[data-invdel]');
  if (d) {
    const code = d.closest('[data-code]').dataset.code;
    if (!await sure(`Delete the code ${code}? Nobody can use it after this.`)) return;
    const { error } = await sb.from('invites').delete().eq('code', code);
    if (error) return toast('Not deleted: ' + error.message);
    toast('Deleted'); loadInvites();
  }
});

// =====================================================================================================
// Applications: "Join as tester" sign-ups from the landing page
// =====================================================================================================
let rows = [], photos = new Map(), filter = 'all';
async function loadApps() {
  const { data, error } = await sb.from('testers').select('*').order('created_at', { ascending: false });
  if (error) return toast('Could not load: ' + error.message);
  rows = data;
  // photos are private: short-lived signed links, made in one call
  const need = rows.filter(r => r.photo_path && !photos.has(r.photo_path)).map(r => r.photo_path);
  if (need.length) {
    const { data: urls } = await sb.storage.from('tester-photos').createSignedUrls(need, 3600);
    for (const u of urls || []) if (u.signedUrl) photos.set(u.path, u.signedUrl);
  }
  render();
}
$('reload').addEventListener('click', loadApps);

async function update(id, patch) {
  const { error } = await sb.from('testers').update(patch).eq('id', id);
  if (error) return toast('Not saved: ' + error.message);
  Object.assign(rows.find(r => r.id === id), patch);
  render();
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  return rows.filter(r => (filter === 'all' || r.status === filter) &&
    (!q || [r.name, r.email, r.instagram, r.note, r.admin_notes, r.pc].some(v => String(v ?? '').toLowerCase().includes(q))));
}
function render() {
  const n = s => rows.filter(r => r.status === s).length, week = rows.filter(r => Date.now() - new Date(r.created_at) < 7 * 864e5).length;
  $('stats').innerHTML = [['Sign-ups', rows.length], ['This week', week], ['Waiting', n('pending')], ['Approved', n('approved')], ['Build sent', n('invited')]]
    .map(([l, v]) => `<div class="stat"><div class="num">${v}</div><div class="lbl">${l}</div></div>`).join('');
  $('chips').innerHTML = ['all', ...STATUSES].map(s => `<button class="chip" data-s="${s}" aria-pressed="${filter === s}">${s === 'all' ? 'All' : s === 'invited' ? 'Build sent' : s[0].toUpperCase() + s.slice(1)}<span class="c">${s === 'all' ? rows.length : n(s)}</span></button>`).join('');
  const list = visible();
  if (!list.length) { $('list').innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>${rows.length ? 'Nobody here' : 'No sign-ups yet'}</h2><p>${rows.length ? 'Try another filter.' : 'When someone presses "Join as tester" on the site, they show up here.'}</p></div>`; return; }
  $('list').innerHTML = list.map(r => {
    const url = r.photo_path && photos.get(r.photo_path);
    const ig = r.instagram ? `<a href="https://instagram.com/${encodeURIComponent(r.instagram.replace(/^@/, ''))}" target="_blank" rel="noopener">${esc(r.instagram)}</a>` : '—';
    return `<article class="card" data-id="${esc(r.id)}">
      <div class="head">
        ${url ? `<img class="avatar" src="${esc(url)}" alt="" data-zoom="${esc(url)}">` : `<div class="avatar">${esc((r.name || '?').trim()[0]?.toUpperCase() || '?')}</div>`}
        <div class="who"><h3>${esc(r.name)}</h3><div class="sub">${new Date(r.created_at).toLocaleString()}</div></div>
        <span class="badge ${esc(r.status)}">${r.status === 'invited' ? 'build sent' : esc(r.status)}</span>
      </div>
      <dl class="facts">
        <dt>Email</dt><dd><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></dd>
        <dt>Instagram</dt><dd>${ig}</dd>
        <dt>PC</dt><dd>${esc(r.pc || '—')}</dd>
        ${r.lang ? `<dt>Language</dt><dd>${esc(r.lang)}</dd>` : ''}
      </dl>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      <textarea class="mine" data-notes placeholder="Your notes (only you see these)">${esc(r.admin_notes || '')}</textarea>
      <div class="acts">
        ${r.status !== 'approved' && r.status !== 'invited' ? '<button class="ok" data-act="approved">Approve</button>' : ''}
        <button class="mail" data-act="mail">Email</button>
        ${r.status === 'approved' ? '<button data-act="invited">Mark build sent</button>' : ''}
        ${r.status !== 'rejected' ? '<button class="no" data-act="rejected">Reject</button>' : '<button data-act="pending">Back to waiting</button>'}
        <button class="del" data-act="delete" title="Delete this sign-up">Delete</button>
      </div>
    </article>`;
  }).join('');
}
$('q').addEventListener('input', render);
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { filter = b.dataset.s; render(); } });
$('list').addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { const d = document.createElement('div'); d.className = 'zoom'; d.innerHTML = `<img src="${esc(z.dataset.zoom)}" alt="">`; d.onclick = () => d.remove(); document.body.append(d); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.card').dataset.id, r = rows.find(x => x.id === id), act = b.dataset.act;
  if (act === 'mail') { const m = MAILS[r.status](r); location.href = `mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent(m.s)}&body=${encodeURIComponent(m.b)}`; return; }
  if (act === 'delete') {
    if (!await sure(`Delete ${r.name}'s sign-up for good?`)) return;
    if (r.photo_path) await sb.storage.from('tester-photos').remove([r.photo_path]);
    const { error } = await sb.from('testers').delete().eq('id', id);
    if (error) return toast('Not deleted: ' + error.message);
    rows = rows.filter(x => x.id !== id); render(); return;
  }
  update(id, act === 'invited' ? { status: 'invited', invited_at: new Date().toISOString() } : { status: act });
});
// notes save a moment after you stop typing
let noteT;
$('list').addEventListener('input', e => {
  if (!e.target.matches('[data-notes]')) return;
  const id = e.target.closest('.card').dataset.id, v = e.target.value;
  clearTimeout(noteT);
  noteT = setTimeout(async () => { const { error } = await sb.from('testers').update({ admin_notes: v || null }).eq('id', id); if (!error) { rows.find(r => r.id === id).admin_notes = v; toast('Note saved'); } }, 700);
});
$('copy').addEventListener('click', async () => { const m = visible().map(r => r.email).join(', '); await navigator.clipboard.writeText(m); toast(`${visible().length} emails copied`); });
$('csv').addEventListener('click', () => {
  const cols = ['created_at', 'name', 'email', 'instagram', 'pc', 'note', 'status', 'admin_notes', 'invited_at', 'lang'];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.join(','), ...visible().map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `testers-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
});
</script>
